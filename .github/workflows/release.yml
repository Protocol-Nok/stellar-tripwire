name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tripwire --target ${{ matrix.target }}
      - name: package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="tripwire-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/tripwire "$name"/
          cp README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "tripwire-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name
          Copy-Item target/${{ matrix.target }}/release/tripwire.exe $name/
          Copy-Item README.md,LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tripwire-${{ matrix.target }}
          path: |
            tripwire-${{ matrix.target }}.tar.gz
            tripwire-${{ matrix.target }}.tar.gz.sha256
            tripwire-${{ matrix.target }}.zip
            tripwire-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: combined checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/SHA256SUMS
          generate_release_notes: true
