name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: corpus is consistent and reproducible
        run: |
          cargo run -q -p tripwire -- generate "$RUNNER_TEMP/corpus"
          cargo run -q -p tripwire -- verify "$RUNNER_TEMP/corpus" --regen
      - name: replay corpus is consistent and reproducible
        run: |
          cargo run -q -p tripwire -- replay generate "$RUNNER_TEMP/replay-corpus"
          cargo run -q -p tripwire -- replay verify "$RUNNER_TEMP/replay-corpus" --regen
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27", cache-dependency-path: adapters/go/go.sum }
      - working-directory: adapters/go
        run: |
          gofmt -l . | (! grep .)
          go vet ./...
          go test ./...
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - working-directory: adapters/java
        run: mvn -B package
  python:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: adapters/python }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
  linter:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: linter }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: linter/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run lint-self
      - run: npm test
  detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/prove-detection.sh
  detection-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: ./scripts/prove-detection-go.sh
  detection-java:
    # Tracks a known-open upstream bug (lightsail-network/java-stellar-sdk#849)
    # rather than comparing a historical pre-fix release to a fixed one -- see
    # the script's own comment. Expected to start failing once that's fixed;
    # treat that as a signal to update, not a flake to silence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./scripts/prove-detection-java.sh
  detection-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: replay/reference-js/package-lock.json }
      - run: ./scripts/prove-detection-replay.sh
