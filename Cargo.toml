[workspace]
resolver = "3"
members = ["crates/tripwire-corpus", "crates/tripwire-cli", "crates/tripwire-replay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Protocol-Nok/stellar-tripwire"
rust-version = "1.87"

[workspace.dependencies]
stellar-xdr = { version = "30", default-features = false, features = ["std", "base64", "hex", "serde", "serde_json"] }
stellar-strkey = "0.0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
heapless = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
